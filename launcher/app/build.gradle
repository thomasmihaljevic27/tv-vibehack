plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 2
        versionName '2.0'
    }

    // One launcher, two kinds of device. "tv" is Android TV / Google TV (the TCL and the other sets in
    // examples/), built by build-and-install. "fire" is Fire TV, built by install-fire.ps1: src/fire adds
    // the HOME takeover (HomeGuard), its own dock and top menu, and leaves out GearKeyService.
    flavorDimensions = ['device']
    productFlavors {
        tv {
            dimension 'device'
        }
        fire {
            dimension 'device'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
